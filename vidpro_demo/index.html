<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>P1 VidPro — Demo</title><style>body{font:16px system-ui;background:#111827;color:#f9fafb;margin:0;padding:30px}main{max-width:780px;margin:auto}textarea{width:100%;height:95px;box-sizing:border-box;padding:12px;border-radius:8px}button{padding:12px 20px;border:0;border-radius:8px;cursor:pointer;margin:10px 8px 10px 0}video{max-width:100%;max-height:500px;display:block;margin-top:15px}a{color:#93c5fd}small{color:#d1d5db}</style></head><body><main><h1>P1 VidPro</h1><p>Video creation platform — integration demonstration</p><small>Demo mode: displays an existing video; new AI video generation is not connected yet.</small><form id="form"><p><label for="prompt">Describe your video</label></p><textarea id="prompt" required minlength="3" placeholder="Create a cinematic video about gratitude..."></textarea><br><button type="submit">Try demo</button><button type="button" id="mic">🎤 Dictate</button></form><p id="status" role="status"></p><div id="result" hidden><video controls id="player"></video><p><a id="download" href="/api/sample" download="P1_VidPro_Sample.mp4">Download sample video</a></p></div></main><script>const form=document.getElementById('form'),status=document.getElementById('status'),result=document.getElementById('result');form.addEventListener('submit',async e=>{e.preventDefault();result.hidden=true;status.textContent='Checking sample…';try{const r=await fetch('/api/videos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:document.getElementById('prompt').value})});const data=await r.json();if(!r.ok)throw Error(data.detail||'Request failed');status.textContent=data.message;if(data.status==='sample_ready'){document.getElementById('player').src='/api/sample';result.hidden=false;}else status.textContent+=' Add the sample MP4 to the server first.';}catch(err){status.textContent='Error: '+err.message;}});document.getElementById('mic').onclick=()=>{const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SpeechRecognition){status.textContent='Speech recognition unavailable in this browser. Please type your prompt.';return;}const recognition=new SpeechRecognition();recognition.lang='en-US';recognition.onresult=e=>document.getElementById('prompt').value=e.results[0][0].transcript;recognition.onerror=e=>status.textContent='Microphone error: '+e.error;recognition.start();};</script></body></html>
